# Flux Panel 节点的 systemd-journald 容量限制（可选防护模板）
#
# ⚠️ 本文件是「可选防护」，不是必装项。
#
# ── 生产实测结论（2026-10-30，Debian 12，87.83.207.7）────────────────────
# journalctl --disk-usage      → 84.1 MB（远低于 journald 默认上限）
# journalctl -u flux_agent --since '5 min ago' | wc -l → 1 行
# 30 分钟内仅 3 条「✅ 定时配置上报成功」（每 10 分钟 1 条）
# /etc/systemd/journald.conf.d 目录原本不存在，journald.conf 全为注释默认值
#
# ➜ 在该节点上，journal **不是**内存或磁盘问题，安装本模板没有收益。
#
# ── 什么情况下才需要它 ────────────────────────────────────────────────
# go-gost/x/handler/relay/handler.go:130 有一行 INFO 级日志：
#     log.Infof("%s <> %s", conn.RemoteAddr(), conn.LocalAddr())
# 每条 relay 连接打印一对。如果某节点：
#   · 使用 relay 链路且转发量大，或
#   · gost.json 显式设置了 "log": {"level": "info"}
# 就可能出现日志刷屏。此时本模板可以把 journal 总量钉在 200 MB。
#
# 另一种更对症的做法是调高日志级别（不改 journal 配置）：
#   在 gost.json 顶层加 "log": {"level": "warn"}
#   或在 systemd 单元里加 Environment="GOST_LOG_LEVEL=warn"
#
# ── 安装方式 ─────────────────────────────────────────────────────────
#   sudo mkdir -p /etc/systemd/journald.conf.d
#   sudo cp deploy/journald-flux.conf /etc/systemd/journald.conf.d/99-flux.conf
#   sudo systemctl restart systemd-journald
#   # 立即回收历史占用（保留最近 200MB）：
#   sudo journalctl --vacuum-size=200M
#
# ── 影响面 ───────────────────────────────────────────────────────────
# 这是**宿主机全局**配置，会影响该机器上所有服务的日志保留窗口，
# 不只是 Flux Panel。生产应用前请确认其他服务的排障需求。

[Journal]
# journal 落盘总量上限
SystemMaxUse=200M
# 单个 journal 文件上限（超过即轮转）
SystemMaxFileSize=32M
# 保留时长上限
MaxRetentionSec=1month
# 压缩存储，降低磁盘占用
Compress=yes
# 写入速率限制（默认 10000 条/30 秒，这里收紧到 2000 条/30 秒）
RateLimitIntervalSec=30s
RateLimitBurst=2000
