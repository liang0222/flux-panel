# 直接用 Docker Hub 上的镜像部署（不需要源码/构建）
# 用法：cp .env.example .env（填 JWT_SECRET）→ docker compose -f docker-compose.registry.yml pull && up -d
services:
  backend:
    image: ${FLUX_BACKEND_IMAGE:-docker.io/ahmadplayz721/flux-panel-backend:2.0.7-beta}
    # SQLite 统计任务只允许单实例；同一数据卷不得再挂载给其他后端。
    scale: 1
    container_name: springboot-backend
    restart: unless-stopped
    environment:
      DB_PATH: /app/data/gost.db
      JWT_SECRET: ${JWT_SECRET:?请先在 .env 设置随机 JWT_SECRET（openssl rand -hex 32）}
      PANEL_ALLOWED_ORIGINS: ${PANEL_ALLOWED_ORIGINS:-}
      LOG_DIR: /app/logs
      JAVA_OPTS: "-Xms64m -Xmx512m -XX:MaxMetaspaceSize=192m -XX:TrimNativeHeapInterval=15000 -Dfile.encoding=UTF-8 -Duser.timezone=Asia/Shanghai"
    ports:
      - "${BACKEND_BIND_IP:-127.0.0.1}:${BACKEND_PORT:-6365}:6365"
    volumes:
      - backend_logs:/app/logs
      - sqlite_data:/app/data
    networks: [gost-network]
    stop_grace_period: 30s
    stop_signal: SIGTERM
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "sh", "-c", "wget --no-verbose --tries=1 --spider http://localhost:6365/flow/test || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  frontend:
    image: ${FLUX_FRONTEND_IMAGE:-docker.io/ahmadplayz721/flux-panel-frontend:2.0.7-beta}
    container_name: vite-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_BIND_IP:-127.0.0.1}:${FRONTEND_PORT:-6366}:80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      backend:
        condition: service_healthy
    networks: [gost-network]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  sqlite_data:
    name: sqlite_data
  backend_logs:
    name: backend_logs

networks:
  gost-network:
    name: gost-network
    driver: bridge
