name: Verify and build release artifacts

on:
  push:
    branches: ['**']
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:

permissions:
  contents: read

env:
  VERSION: '2.0.7-beta'

jobs:
  verify-java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          cache-dependency-path: springboot-backend/pom.xml
      - name: Run Maven tests and package
        working-directory: springboot-backend
        run: mvn -B -ntp clean verify

  verify-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: |
            go-gost/go.sum
            go-gost/x/go.sum
      - name: Race tests for the agent module
        working-directory: go-gost
        run: go test -race ./...
      - name: Race tests for the nested transport module
        working-directory: go-gost/x
        run: go test -race ./...
      - name: Build Linux release binaries and checksums
        working-directory: go-gost
        shell: bash
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -ldflags '-s -w' -o "dist/gost-$arch" .
          done
          cd dist
          sha256sum gost-amd64 gost-arm64 > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: gost-linux-${{ github.sha }}
          path: go-gost/dist/
          if-no-files-found: error

  verify-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check installer rollbacks and Compose configurations
        run: bash deploy/test-installers.sh

  panel-changes:
    # Test every branch and PR. Preserve the original two release branches for registry pushes.
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/port-traffic-ranking')
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.check.outputs.images }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: check
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
        run: |
          images=()
          base=$(git rev-parse --verify "refs/tags/${VERSION}^{commit}" 2>/dev/null || true)
          for component in backend frontend; do
            case "$component" in
              backend) dir=springboot-backend ;;
              frontend) dir=vite-frontend ;;
            esac
            if [[ "$EVENT" == workflow_dispatch || -z "$base" ]] || ! git diff --quiet "$base" HEAD -- "$dir/"; then
              images+=("$component")
            fi
          done
          python3 -c 'import json, sys; print("images=" + json.dumps(sys.argv[1:]))' "${images[@]}" >> "$GITHUB_OUTPUT"

  publish-panel-images:
    needs: [verify-java, verify-go, verify-deploy, panel-changes]
    if: needs.panel-changes.outputs.images != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: ${{ fromJSON(needs.panel-changes.outputs.images) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - name: Build and push panel image
        shell: bash
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          case "$COMPONENT" in
            backend) dir=springboot-backend ;;
            frontend) dir=vite-frontend ;;
            *) exit 1 ;;
          esac
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            -t "ahmadplayz721/flux-panel-${COMPONENT}:latest" \
            -t "ahmadplayz721/flux-panel-${COMPONENT}:${VERSION}" "./$dir"
