name: Verify and build release artifacts

on:
  push:
    branches: ['**']
    tags: ['2.0.7-beta-r[0-9]*']
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          cache-dependency-path: springboot-backend/pom.xml
      - name: Run Maven tests and package
        working-directory: springboot-backend
        run: mvn -B -ntp clean verify

  verify-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.4'
          cache-dependency-path: |
            go-gost/go.sum
            go-gost/x/go.sum
      - name: Race tests for the agent module
        working-directory: go-gost
        run: go test -race ./...
      - name: Race tests for the nested transport module
        working-directory: go-gost/x
        run: go test -race ./...
      - name: Build Linux release binaries and checksums
        working-directory: go-gost
        shell: bash
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -buildvcs=false -trimpath -ldflags '-s -w' -o "dist/gost-$arch" .
          done
          cd dist
          sha256sum gost-amd64 gost-arm64 > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: gost-linux-${{ github.sha }}
          path: go-gost/dist/
          if-no-files-found: error

  verify-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check installer rollbacks and Compose configurations
        run: bash deploy/test-installers.sh

  release-preflight:
    if: github.repository == 'liang0222/flux-panel' && github.ref_type == 'tag' && startsWith(github.ref_name, '2.0.7-beta-r')
    needs: [verify-java, verify-go, verify-deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: gost-linux-${{ github.sha }}
          path: agent-dist
      - name: Check tagged installer references and Agent assets
        env:
          VERSION: ${{ github.ref_name }}
        run: python3 -I deploy/check-release.py "$VERSION" agent-dist

  publish-panel-images:
    needs: release-preflight
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            directory: springboot-backend
          - component: frontend
            directory: vite-frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - name: Publish and verify both Linux platforms for this image
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
          COMPONENT: ${{ matrix.component }}
          DIRECTORY: ${{ matrix.directory }}
        run: |
          image="docker.io/ahmadplayz721/flux-panel-${COMPONENT}:${VERSION}"
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" --tag "$image" "./$DIRECTORY"
          docker buildx imagetools inspect "$image" --raw | jq -e '
            [.manifests[].platform | select(.os == "linux").architecture] |
            (index("amd64") != null and index("arm64") != null)'

  publish-agent-release:
    needs: publish-panel-images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gost-linux-${{ github.sha }}
          path: agent-dist
      - name: Create prerelease and confirm the published asset digests
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
        run: |
          if ! gh release view "$VERSION" --json tagName --jq '.tagName' >/dev/null; then
            gh release create "$VERSION" --verify-tag --prerelease --draft \
              --title "Flux Panel ${VERSION}" \
              --notes 'Linux amd64/arm64. Upgrade the panel and verify it before upgrading the nodes.'
          fi
          release=$(gh release view "$VERSION" --json databaseId,isDraft,isPrerelease)
          jq -e '.isPrerelease and (.databaseId > 0)' <<< "$release" >/dev/null
          release_id=$(jq -r '.databaseId' <<< "$release")
          is_draft=$(jq -r '.isDraft' <<< "$release")
          asset_endpoint="repos/$GH_REPO/releases/$release_id/assets"
          assets=$(gh api --paginate --slurp "$asset_endpoint")
          for asset in gost-amd64 gost-arm64 SHA256SUMS; do
            if [[ $is_draft == true ]] && ! jq -e --arg name "$asset" \
                'any(.[][]; .name == $name)' <<< "$assets" >/dev/null; then
              gh release upload "$VERSION" "agent-dist/$asset"
            fi
          done
          assets=$(gh api --paginate --slurp "$asset_endpoint")
          for asset in gost-amd64 gost-arm64 SHA256SUMS; do
            digest=$(sha256sum "agent-dist/$asset" | cut -d' ' -f1)
            if ! jq -e --arg name "$asset" --arg digest "sha256:$digest" \
                'any(.[][]; .name == $name and .state == "uploaded" and .digest == $digest)' <<< "$assets" >/dev/null; then
              echo "Missing or mismatched release asset: $asset" >&2
              exit 1
            fi
          done
          if [[ $is_draft == true ]]; then
            gh release edit "$VERSION" --draft=false
          fi
          gh release view "$VERSION" --json isDraft,isPrerelease | jq -e '.isPrerelease and (.isDraft | not)'
