name: Build and Push Images Based on Version

# 在这里定义统一版本号
env:
  VERSION: "2.0.7-beta"

on:
  push:
    branches:
      - main
      - feat/port-traffic-ranking
    # 纯文档改动不重建镜像（多架构构建约 10 分钟），需要时用 workflow_dispatch 手动触发
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

jobs:
  check-version:
    name: Check Version and Decide Build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ env.VERSION }}
      should_build: ${{ steps.check-tag.outputs.should_build }}
      should_build_gost: ${{ steps.check-tag.outputs.should_build_gost }}
      tag_exists: ${{ steps.check-tag.outputs.tag_exists }}
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Display version
        run: |
          echo "Current version: ${{ env.VERSION }}"

      - name: Check if tag exists and detect changes
        id: check-tag
        run: |
          if git rev-parse "${{ env.VERSION }}" >/dev/null 2>&1; then
            echo "Tag ${{ env.VERSION }} already exists"
            echo "tag_exists=true" >> $GITHUB_OUTPUT

            # 检查从tag到现在，面板源码（后端/前端）是否有变化
            TAG_COMMIT=$(git rev-list -n 1 "${{ env.VERSION }}")
            echo "Tag commit: $TAG_COMMIT"
            echo "Current HEAD: $(git rev-parse HEAD)"

            # 标签存在不等于镜像是最新的：只要面板源码相对标签有改动就必须重建，
            # 否则推送新代码后流水线仍然显示成功，但镜像仓库里还是旧镜像。
            if git diff --quiet --ignore-all-space --ignore-blank-lines $TAG_COMMIT HEAD -- springboot-backend/ vite-frontend/ 2>/dev/null; then
              echo "✅ Panel sources unchanged since tag (no content changes)"
              echo "should_build=false" >> $GITHUB_OUTPUT
            else
              echo "🔄 Detected changes in panel sources since tag, will rebuild:"
              git diff --stat $TAG_COMMIT HEAD -- springboot-backend/ vite-frontend/ || true
              echo "should_build=true" >> $GITHUB_OUTPUT
            fi
            
            # 检查 go-gost 目录下是否有实际的文件内容变化
            # 使用 --ignore-all-space 和 --ignore-blank-lines 来忽略空白差异
            # 使用 --exit-code: 0表示无差异，1表示有差异
            if git diff --quiet --ignore-all-space --ignore-blank-lines $TAG_COMMIT HEAD -- go-gost/ 2>/dev/null; then
              echo "✅ GOST files unchanged since tag (no content changes)"
              echo "should_build_gost=false" >> $GITHUB_OUTPUT
            else
              # 显示差异以便调试
              echo "🔄 Detected changes in go-gost directory:"
              git diff --stat $TAG_COMMIT HEAD -- go-gost/ || true
              echo "should_build_gost=true" >> $GITHUB_OUTPUT
            fi
          else
            echo "Tag ${{ env.VERSION }} does not exist, will build all components"
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "should_build_gost=true" >> $GITHUB_OUTPUT
            echo "tag_exists=false" >> $GITHUB_OUTPUT
          fi

  build-vite:
    name: Build & Push Vite Frontend
    needs: check-version
    if: needs.check-version.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push Vite Docker images
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --push \
            -t ahmadplayz721/flux-panel-frontend:latest \
            -t ahmadplayz721/flux-panel-frontend:${VERSION} \
            ./vite-frontend

  build-java:
    name: Build & Push Spring Boot Backend
    needs: check-version
    if: needs.check-version.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK and Maven
        uses: actions/setup-java@v3
        with:
          java-version: 21
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build Java JAR
        working-directory: ./springboot-backend
        run: mvn clean package -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push Java Docker images
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --push \
            -t ahmadplayz721/flux-panel-backend:latest \
            -t ahmadplayz721/flux-panel-backend:${VERSION} \
            ./springboot-backend
